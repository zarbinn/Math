<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f6f1" />
  <meta name="description" content="A friendly Grade 4 mathematics revision app with practice, instant feedback and focused retests." />
  <title>Maths Quest | Grade 4 Revision</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Maths Quest home"><span class="brand-mark">✳</span><span>maths<span class="brand-light">quest</span><small>GRADE 4 REVISION</small></span></a>
      <button id="resetBtn" class="reset-btn" type="button"><span aria-hidden="true">↻</span> Reset progress</button>
    </header>
    <main id="app" class="main-content"></main>
    <footer>Made for curious minds <span>✦</span> Take your time. You’ve got this.</footer>
  </div>
  <dialog id="resetDialog" class="confirm-dialog">
    <form method="dialog"><span class="dialog-icon">↻</span><h2>Start fresh?</h2><p>This clears your test answers, results and saved progress.</p><div class="dialog-actions"><button class="quiet-btn" value="cancel">Keep going</button><button id="confirmReset" class="danger-btn" value="confirm">Reset everything</button></div></form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
